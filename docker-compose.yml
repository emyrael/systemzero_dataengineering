# Docker Compose for Coding Test Infrastructure
# Used by both data-engineering and ai-engineering assessments

services:
  # SurrealDB - Graph database for GraphRAG
  surrealdb:
    # Pinned so every run uses the same server version. The surrealdb 2.0 Python client embeds a
    # SurrealDB 2.x engine (surrealdb-core 2.3.10; mem://, surrealkv://); the loader and queries work on both (docs/GRAPH_MODEL.md).
    image: surrealdb/surrealdb:v4.0.0
    container_name: coding-test-surrealdb
    user: root
    # SurrealDB 4 rejects the `file:` scheme; `surrealkv:` is its persistent storage engine.
    command: start --user root --pass root --log info surrealkv:/data/database.db
    ports:
      - "8000:8000"
    volumes:
      - surrealdb_data:/data
    environment:
      - SURREAL_USER=root
      - SURREAL_PASS=root
    healthcheck:
      # The image is distroless (no curl or shell); the binary has its own readiness check.
      test: ["CMD", "/surreal", "is-ready", "--endpoint", "http://localhost:8000"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis - Optional caching layer
  redis:
    image: redis:7-alpine
    container_name: coding-test-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  surrealdb_data:
  redis_data:
